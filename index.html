<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#59484c"><meta name="description" content="Sekavore is a browser-playable incremental mining game."><title>Sekavore</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bomb-panel.css"><link rel="stylesheet" href="consumables-panel.css"><link rel="stylesheet" href="hud-v016.css"><link rel="stylesheet" href="hud-v017.css"><link rel="stylesheet" href="floor-auto-v019.css"><link rel="stylesheet" href="economy-v022.css"><link rel="stylesheet" href="main-controls-v023.css"><link rel="stylesheet" href="stats-currencies-v026.css"><link rel="stylesheet" href="floor-selector-v024.css"><link rel="stylesheet" href="bomb-panel.css"></head><body>
<div id="game" class="game">
 <div class="topbar">
  <div class="hud-left"><div class="hud-gold"><span class="hud-coin" aria-hidden="true">◉</span><strong id="gold">0</strong><small>GOLD</small></div><div class="metertext"><b id="level">LV 1</b><span><em>XP</em> <span id="levelXp">0 / 28 XP</span></span></div><div class="meter"><div id="xpFill" class="xpfill"></div></div></div>
  <div class="hud-right"><div class="resource"><span class="blue">◆</span><strong id="gems">0</strong><small>GEMS</small></div><div class="resource"><span class="prestige-symbol">✦</span><strong id="hudPrestige">0</strong><small>PRESTIGE</small></div></div><div class="hud-top-actions" aria-label="Statistics and currency shortcuts"><button id="statsQuick" class="hud-action" type="button" title="Statistics" aria-label="Open statistics">▥</button><button id="currenciesQuick" class="hud-action" type="button" title="Currencies and resources" aria-label="Open currencies and resources">▧</button></div>
  <button id="hubBtn" class="top-icon miner-emblem" title="Open game menus" aria-label="Open game menus"><svg viewBox="0 0 38 50" class="miner-idol" aria-hidden="true" focusable="false"><path fill="#1b1a23" d="M10 3h18v4h5v27h-5v7H10v-7H5V7h5z"/><path fill="#c09b4c" d="M12 4h14v4h4v25h-4v6H12v-6H8V8h4z"/><path fill="#ffe195" d="M13 6h5v5h-5zm9 0h3v8h-3zM10 13h4v15h-4zm18 2h2v11h-2z"/><path fill="#65462e" d="M16 10h7v6h-7zM14 21h11v8H14zM11 31h17v6H11z"/><path fill="#85d8d3" d="M17 18h5v5h-5z"/><path fill="#f4d876" d="M17 31h5v5h-5z"/><path fill="#1b1d28" d="M4 16h5v4H4zM29 16h5v4h-5z"/></svg></button>
 </div>
 <div class="stage"><canvas id="field" width="360" height="602" aria-label="Interactive pixel art mining field"></canvas>
  <div class="fieldtop"> <button type="button" class="floor-badge" id="floorMapBtn" aria-label="Open floor map">FLOOR <strong id="floor">1</strong> <span id="floorName">Stone Mine · MAP ▸</span></button><div class="quota"><span id="quotaText">0 / 9</span><div class="meter"><div id="quotaFill"></div></div></div></div>
  <div class="side-left"><div class="chest-head">▣</div><div class="vertical-bar"><div id="chestFill"></div></div><div class="chest-head pink">✦</div><div class="vertical-bar second"><div id="starFill"></div></div><button id="statusToggle" class="status-toggle" type="button" aria-expanded="true" aria-controls="statusGroup" aria-label="Show or hide status effects">▾</button><div class="status-group" id="statusGroup" aria-label="Active mining status"></div></div>
  <div class="right-resources" id="resourceRows" aria-label="Resource counters"></div>
  <button type="button" id="obeliskQuick" class="timed-shortcut obelisk-shortcut" aria-label="Open Obelisk fight" title="Obelisk fight"><span>♜</span><small id="obeliskQuickState">FIGHT</small></button>
  <div class="floor-controls" aria-label="Floor controls"><button id="floorPair" class="control red paired" title="Open floor map">↕</button><button id="floorUp" class="control red" title="Descend to the next floor">▲</button><button id="floorDown" class="control red" title="Return to previous floor">▼</button><button id="autoFloor" class="control small">AUTO<br><span id="autoFloorState">OFF</span></button></div>
  <button id="eventShortcut" class="event-shortcut hidden" type="button" aria-label="Seasonal event" title="Seasonal event"><span>✧</span><small>EVENT</small></button>
  <div class="quick-side" aria-label="Consumables and bomb shortcuts"><button id="inventoryQuick" type="button" aria-label="Open consumables inventory" title="Consumables">▣</button><button id="bombDrawerBtn" type="button" aria-label="Open bomb inventory" title="Bombs">✹</button></div>
  <section id="quickDrawer" class="quick-drawer hidden" aria-label="Quick item drawer"><div class="drawer-head"><span id="drawerTitle">INVENTORY</span><button type="button" id="drawerClose" aria-label="Close overlay">✕</button></div><div id="drawerContent"></div></section>
  <div id="hint" class="hint">DRAG OR HOLD THE HAND TO MINE</div>
  <div id="targetHud" class="target-hud hidden" aria-live="off"><span class="target-gem" id="targetGem">◆</span><div class="target-info"><strong id="targetName">ROCK</strong><small id="targetHpText">HP 0 / 0</small><div class="target-meter"><div id="targetHpFill"></div></div></div></div>
  <div id="toast" class="toast" role="status"></div>

 </div>
 <nav class="dock" aria-label="Pinned game menus">
 <div class="dock-main"><button id="pin0" data-pin="0" aria-label="Craft"><span>▣</span><small>CRAFT</small></button><button id="pin1" data-pin="1" aria-label="Upgrades"><span>⛏</span><small>UPGRADES</small></button><button id="pin2" data-pin="2" aria-label="Sell"><span>◉</span><small>SELL</small></button><button id="menuDock" data-menu="hub"><span>▦</span><small>MENU</small></button><button id="hubCloseDock" type="button" aria-label="Close Menu Hub"><span>✕</span><small>CLOSE</small></button></div>
 <button id="shopDock" type="button" class="store-shortcut" aria-label="Open gem and purchase store"><span>▤</span><small>SHOP</small></button>
 </nav>
 <div id="overlay" class="overlay hidden" aria-hidden="true"><div class="panel"><header class="panel-head"><button id="backBtn" class="back" title="Back to menu">‹</button><h1 id="panelTitle">MENU</h1><button id="closeBtn" class="close" title="Close">×</button></header><div id="panelContent" class="panel-scroll"></div></div></div>
 <div id="confirm" class="confirm hidden"><div class="confirm-box"><h2 id="confirmTitle">Are you sure?</h2><p id="confirmBody"></p><div class="confirm-actions"><button id="confirmCancel" class="btn">CANCEL</button><button id="confirmYes" class="btn danger">CONFIRM</button></div></div></div>
</div>
<p class="below">SEKAVORE — browser-playable incremental mining game. Progress is saved locally in this browser.</p>
<script type="module" src="game.js"></script></body></html>
