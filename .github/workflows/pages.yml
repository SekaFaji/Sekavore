name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify before publish
        run: |
          node --check core.js
          node --check game.js
          node --check floor-selector-v024.js bomb-controls-v025.js
          npm test
      - name: Assemble only public site files
        run: |
          mkdir -p _site
          cp index.html floor-auto-v019.js floor-auto-v019.css economy-v022.css style.css hud-v016.css hud-v017.css bomb-panel.css consumables-panel.css core.js game.js mining-art-v018.js mining-waves-v021.js main-controls-v023.css stats-currencies-v026.css floor-selector-v024.js floor-selector-v024.css bomb-controls-v025.js chests-v027.js chests-v027.css .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
